<svg width="100%" viewBox="0 0 680 560" role="img" style="background: rgb(255, 255, 255);" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">JS agissant directement sur le DOM</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Schéma circulaire montrant le cycle JS → DOM → JS avec manipulation directe</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Flèche JS → DOM (haut) -->
  <path d="M 310 170 Q 340 80 390 150" fill="none" stroke="#555" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)" style="fill:none;stroke:rgb(85, 85, 85);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Flèche DOM → JS (bas) -->
  <path d="M 370 310 Q 340 400 290 310" fill="none" stroke="#555" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)" style="fill:none;stroke:rgb(85, 85, 85);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Nœud JS (jaune) -->
  <circle cx="240" cy="240" r="80" fill="#F7DF1E" stroke="#c9b700" stroke-width="1.5" style="fill:rgb(247, 223, 30);stroke:rgb(201, 183, 0);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="240" y="248" text-anchor="middle" font-size="22" font-weight="600" fill="#333" font-family="sans-serif" style="fill:rgb(51, 51, 51);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:22px;font-weight:600;text-anchor:middle;dominant-baseline:auto">JS</text>

  <!-- Nœud DOM (bleu foncé) -->
  <circle cx="440" cy="240" r="80" fill="#185FA5" stroke="#0C447C" stroke-width="1.5" style="fill:rgb(24, 95, 165);stroke:rgb(12, 68, 124);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="440" y="248" text-anchor="middle" font-size="18" font-weight="500" fill="#E6F1FB" font-family="sans-serif" style="fill:rgb(230, 241, 251);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:18px;font-weight:500;text-anchor:middle;dominant-baseline:auto">DOM</text>

  <!-- Étiquette flèche JS → DOM (haut) -->
  <text x="270" y="60" text-anchor="start" font-size="12" fill="#555" font-family="sans-serif" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">Sélectionne et modifie</text>
  <text x="270" y="76" text-anchor="start" font-size="12" fill="#555" font-family="sans-serif" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">directement les nœuds</text>
  <text x="270" y="92" text-anchor="start" font-size="12" fill="#555" font-family="sans-serif" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">(getElementById, querySelector…)</text>

  <!-- Étiquette flèche DOM → JS (bas) -->
  <text x="270" y="400" text-anchor="start" font-size="12" fill="#555" font-family="sans-serif" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">Événements déclenchés</text>
  <text x="270" y="416" text-anchor="start" font-size="12" fill="#555" font-family="sans-serif" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">(click, input, scroll…)</text>

  <!-- Bandeau d'avertissement en bas -->
  <rect x="40" y="460" width="600" height="76" rx="8" fill="#FFF3CD" stroke="#F0AD00" stroke-width="1" style="fill:rgb(255, 243, 205);stroke:rgb(240, 173, 0);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="56" y="482" text-anchor="start" font-size="12" fill="#7a5200" font-family="sans-serif" font-weight="500" style="fill:rgb(122, 82, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">⚠ Coûteux en performance sur des interfaces complexes :</text>
  <text x="56" y="500" text-anchor="start" font-size="12" fill="#7a5200" font-family="sans-serif" style="fill:rgb(122, 82, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">chaque modification déclenche immédiatement un recalcul</text>
  <text x="56" y="518" text-anchor="start" font-size="12" fill="#7a5200" font-family="sans-serif" style="fill:rgb(122, 82, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">du rendu par le navigateur.</text>
</svg>